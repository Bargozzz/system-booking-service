services:
  backend:
    build: ./backend
    container_name: mini-booking-backend
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/app/data/minibooking.db
      - PORT=8080
    volumes:
      - booking-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8080
    container_name: mini-booking-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  booking-data:
